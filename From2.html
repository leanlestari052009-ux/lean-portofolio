<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran</title>
    <style>
        
        body {
            background-color: #f6f7fa; 
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        
        .box-form {
            background-color: #e0f2fe; 
            width: 550px;
            margin: 0 auto; 
            padding: 20px;
            border-radius: 8px;
        }

        
        h2 {
            text-align: center;
            color: #1d4ed8;
            margin-top: 0;
            margin-bottom: 20px;
        }

        
        .baris {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .kolom {
            width: 48%; 
        }

        .baris-penuh {
            margin-bottom: 12px;
        }

        
        label {
            display: block;
            color: #1e40af; 
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #93c5fd;
            border-radius: 4px;
            box-sizing: border-box; 
        }

        
        .label-biru {
            background-color: #2563eb;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        
        .tombol-kirim {
            background-color: #2563eb; 
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .tombol-kirim:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="box-form">
        <h2>Create Account</h2>

        <form>
            
            <div class="baris">
                <div class="kolom">
                    <label>First name *</label>
                    <input type="text" placeholder="enter your first name" required>
                </div>
                <div class="kolom">
                    <label>Last name</label>
                    <input type="text" placeholder="enter your last name">
                </div>
            </div>

            
            <div class="baris-penuh">
                <label>Email *</label>
                <input type="email" placeholder="enter your email" required>
            </div>

            
            <div class="baris">
                <div class="kolom">
                    <label>Password *</label>
                    <input type="password" placeholder="enter your password" required>
                </div>
                <div class="kolom">
                    <label>Confirm Password *</label>
                    <input type="password" placeholder="enter your password again" required>
                </div>
            </div>

            
            <div class="baris">
                <div class="kolom">
                    <label>Gender:</label>
                    <div>
                        <input type="radio" name="gender" id="male"> <label for="male" style="display:inline; font-weight:normal; color:#333;">Male</label>
                        <input type="radio" name="gender" id="female"> <label for="female" style="display:inline; font-weight:normal; color:#333;">Female</label>
                    </div>
                </div>
                <div class="kolom">
                    <label>Hobbies</label>
                    <div style="font-size: 14px; color: #333;">
                        <input type="checkbox"> Music
                        <input type="checkbox"> Sports
                        <input type="checkbox"> Dance
                        <input type="checkbox"> Movies
                    </div>
                </div>
            </div>

            
            <div class="baris">
                <div class="kolom">
                    <label>Source of Income</label>
                    <select>
                        <option>Employed</option>
                        <option>Self-Employed</option>
                        <option>Unemployed</option>
                    </select>
                </div>
                <div class="kolom">
                    <label>Income</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="range" min="0" max="100" value="20">
                        <span class="label-biru">20K</span>
                    </div>
                </div>
            </div>

            
            <div class="baris">
                <div class="kolom">
                    <label>Upload Profile Picture</label>
                    <input type="file">
                </div>
                <div class="kolom">
                    <label>Age</label>
                    <input type="number" value="18">
                </div>
            </div>

            
            <div class="baris-penuh">
                <label>Bio</label>
                <textarea rows="4"></textarea>
            </div>

            
            <div style="text-align: right; margin-top: 15px;">
                <button type="submit" class="tombol-kirim">Create</button>
            </div>
        </form>
    </div>

</body>
</html>
